    <header>
        <div class="logo">Sakia</div>

        <nav id="nav-menu">

    <section class="skills-section">

        <div class="info-card">
            <h3><i class="fa-solid fa-laptop-code"></i> Frontend Development</h3>

                <span class="pill"><i class="fa-brands fa-html5"></i> HTML</span>
                <span class="pill"><i class="fa-brands fa-css3-alt"></i> CSS</span>
                <span class="pill"><i class="fa-brands fa-js"></i> JavaScript</span>

                <span class="pill"><i class="fa-brands fa-figma"></i> Figma</span>
            </div>
        </div>

        <!-- Programming Card -->
        <div class="info-card">
            <h3><i class="fa-solid fa-code"></i> Programming</h3>
            <div class="pills-container">
                <span class="pill">C++</span>

                <span class="pill">OOP</span>

            <h3><i class="fa-solid fa-wrench"></i> Tools</h3>
            <div class="pills-container">
                <span class="pill"><i class="fa-brands fa-github"></i> GitHub</span>

            <a href="mailto:sakia.zannat2023@gmail.com"><i class="fa-regular fa-envelope"></i></a>
        </div>
    </footer>

    <script>
        const hamburger = document.getElementById('hamburger');
        const navMenu = document.getElementById('nav-menu');

        hamburger.addEventListener('click', () => {
            navMenu.classList.toggle('active');
            
            const icon = hamburger.querySelector('i');
            if (navMenu.classList.contains('active')) {
                icon.classList.remove('fa-bars');
                icon.classList.add('fa-xmark');
            } else {
                icon.classList.remove('fa-xmark');
                icon.classList.add('fa-bars');
            }
        });
    </script>
